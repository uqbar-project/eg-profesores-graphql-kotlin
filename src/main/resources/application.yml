spring:
  #   base de datos posta
  datasource:
    url: jdbc:postgresql://0.0.0.0:5432/facultad
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
#        para evitar n+1 queries con eager / open-in-view: true
#        default_batch_fetch_size: 2
        format_sql: true

server:
  error:
    include-message: always
    include-exception: true
    include-binding-errors: always
    include-stacktrace: always
